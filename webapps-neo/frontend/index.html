        </noscript>

        <!-- The app mounts here rather than straight into <body>. Rendering
             into the body puts the app's own elements among whatever else lives
             there — the noscript, the module script, and anything a browser
             extension injects — and an extension that reorders the body's
             children then reorders the app's layout with it. Its own container
             keeps the two apart. -->
        <div id="app"></div>

        <script type="module" src="/src/index.jsx"></script>
    </body>
