# Engine with authorization switched ON, for the role/area scenarios seeded by
# `dev-fixtures/bot/seed-auth.js`. The plain docker-compose.yaml deliberately
# runs without authorization, where every permission check answers true.
#
#   docker compose -f docker-compose.authorization.yaml up -d
#   cd dev-fixtures/bot && npm run deploy && npm run seed-auth
#
# See dev-fixtures/README.md, section "Authorization scenarios".
services:
  operaton:
    image: operaton/operaton:latest
    environment:
      - OPERATON_BPM_RUN_CORS_ENABLED=true
      - OPERATON_BPM_RUN_AUTH_ENABLED=true
      - OPERATON_BPM_RUN_CORS_ALLOW_CREDENTIALS=true
      - OPERATON_BPM_RUN_CORS_ALLOWED_ORIGINS=http://127.0.0.1:5173
      - OPERATON_BPM_RUN_CORS_ALLOWED_HEADERS=Origin,X-Requested-With,Content-Type,Accept,Authorization
      # The engine-side authorization checks. Without this the area gating is
      # invisible: an unauthorized check still answers `authorized: true`.
      - OPERATON_BPM_AUTHORIZATION_ENABLED=true
      # Required. The bundled invoice example fails its @PostDeploy hook once
      # authorization is on ("Task.getId() because task is null") and takes the
      # whole engine down with it.
      - OPERATON_BPM_RUN_EXAMPLE_ENABLED=false
      - LOGGING_LEVEL_ROOT=INFO
    ports:
      - "8084:8080"
